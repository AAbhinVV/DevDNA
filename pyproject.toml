[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "devdna"
version = "0.1.0"
description = "DevDNA — Turn your muscle memory into a reusable SDK"
readme = "README.md"
requires-python = ">=3.10"
license = {text = "MIT"}
dependencies = [
    "anthropic>=0.30.0",
    "python-dotenv>=1.0.0",
    "rich>=13.0.0",
    "jinja2>=3.1.0",
    "typer>=0.12.0",
]

[project.optional-dependencies]
dev = [
    "pytest",
    "ruff",
    "bandit",
    "mypy",
]

[project.scripts]
devdna = "devdna.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["devdna"]
